<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plesuj – návrh 2</title><link rel="stylesheet" href="../../vendor/leaflet.css"><link rel="stylesheet" href="../../vendor/MarkerCluster.css"><link rel="stylesheet" href="../../vendor/MarkerCluster.Default.css"><link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💃</text></svg>"></head><body>
<header class="top"><a class="brand" href="./">Plesuj<span>.</span></a><nav><a href="../">Návrhy</a></nav></header>
<section class="hero"><h1>Najděte svůj ples</h1><p id="sub">Plesy a bály v celé ČR na jednom místě</p>
<div class="search"><input id="q" type="search" placeholder="Co hledáte? Název, obec, kapela…" aria-label="Hledat"><input id="psc" inputmode="numeric" maxlength="6" placeholder="PSČ" aria-label="PSČ"><select id="r" aria-label="Okruh"><option>10</option><option selected>25</option><option>50</option><option>100</option></select><span class="km">km</span></div><small id="pscmsg"></small></section>
<section class="filters"><div class="chips" id="tchips"></div><div class="chips" id="mchips"></div>
<div class="chips"><span class="lbl">Vstupné</span><button class="chip" data-c="">jakékoli</button><button class="chip" data-c="0">zdarma</button><button class="chip" data-c="150">do 150 Kč</button><button class="chip" data-c="300">do 300 Kč</button>
<span class="lbl">Od</span><input id="od" type="date"><span class="lbl">Do</span><input id="do" type="date"><label class="ck"><input type="checkbox" id="pl"> jen s plakátem</label><label class="ck"><input type="checkbox" id="nev"> i neověřené místo</label></div></section>
<div class="wrap"><div class="bar"><b id="count"></b><select id="sort"><option value="datum">Nejbližší termín</option><option value="vzd">Nejblíže mně</option><option value="cena">Nejlevnější</option></select>
<div class="seg" role="tablist"><button data-v="cards" class="on">▦ Karty</button><button data-v="map">⌖ Mapa</button><button data-v="cal">▤ Kalendář</button></div></div>
<div id="cards" class="grid"></div><div id="map" hidden></div><div id="cal" hidden></div><button id="more" hidden>Zobrazit další</button></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><button class="x" aria-label="Zavřít">×</button><div id="det"></div></div></div>
<footer>Údaje přebírané od pořadatelů. Plakáty patří pořadatelům, na požádání je odstraníme.</footer>
<script src="../../vendor/leaflet.js"></script><script src="../../vendor/leaflet.markercluster.js"></script><script src="../shared/core.js"></script><script src="app.js"></script></body></html>
